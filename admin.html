<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>공동구매 관리자</title><link rel="stylesheet" href="/style.css"></head><body><main><h1>🔐 공동구매 관리자</h1><section id="login"><form id="loginForm"><label>아이디<input value="admin" disabled></label><label>비밀번호<input id="password" type="password" required autocomplete="current-password"></label><button>로그인</button></form><p id="loginMessage"></p></section><div id="dashboard" hidden><div class="toolbar"><button id="logout" class="secondary">로그아웃</button><button id="refresh">새로고침</button></div><h2>공동구매 생성</h2><form id="newCampaign"><label>공동구매 제목<input id="title" required maxlength="100"></label><button>공동구매 생성</button></form><h2>공동구매 목록</h2><div id="campaignList"></div><section id="editor" hidden><h2 id="editTitle"></h2><div class="toolbar"><button id="toggle">접수 시작</button><button id="export" class="secondary">CSV 다운로드</button></div><h3>대표사진</h3><p>이 공동구매의 상단에 표시되는 사진입니다.</p><input id="coverImage" type="file" accept="image/jpeg,image/png,image/webp,image/gif"><button id="saveCover" type="button">대표사진 저장</button><div id="coverPreview"></div><h3>상품 등록</h3><form id="newProduct"><label>상품명<input id="productName" required></label><label>가격 (원)<input id="productPrice" type="number" min="0" required></label><button>상품 추가</button></form><div id="productList"></div><h3>신청 현황</h3><div id="summary"></div><div id="orderList"></div></section></div><p id="message" role="status"></p><footer><a href="/">고객 페이지</a></footer></main><script type="module" src="/admin.js"></script></body></html>
